services:
  # Self-hosted data-plane Postgres (nofx-hl-screener tables: cvd_bars,
  # candidate_active, liq_levels, oi_snapshots). nofx itself can keep
  # its default SQLite; only the scraper DSN below must point here.
  scraper-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: nofx-scraper-postgres
    environment:
      POSTGRES_USER: ${HLSCRAPER_DB_USER:-nofx}
      POSTGRES_PASSWORD: ${HLSCRAPER_DB_PASSWORD:-nofx}
      POSTGRES_DB: ${HLSCRAPER_DB_NAME:-nofx}
    volumes:
      - scraper-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HLSCRAPER_DB_USER:-nofx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nofx-network

  # ──────────────────────────────────────────────────────────────
  # Self-hosted Hyperliquid data plane (no paid subscriptions).
  # Enabled by default; remove these services (and HLSCRAPER_DSN on
  # the nofx service) to fall back to the paid nofxos/vergex sources.
  # ──────────────────────────────────────────────────────────────
  hl-collector:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-hl-collector
    restart: unless-stopped
    command: ["./hl-collector"]
    depends_on:
      scraper-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${HLSCRAPER_DB_USER:-nofx}:${HLSCRAPER_DB_PASSWORD:-nofx}@scraper-postgres:5432/${HLSCRAPER_DB_NAME:-nofx}?sslmode=disable
      COLLECTOR_COINS: ${HLSCRAPER_COINS:-BTC,ETH,SOL,BNB,XRP,DOGE,ADA,AVAX,LINK,DOT,TRX,LTC,ATOM,UNI,APT,ARB,OP,SUI,TON,CRV}
      SCREENER_REFRESH_SEC: ${HLSCRAPER_SCREENER_REFRESH_SEC:-1800}
    networks:
      - nofx-network

  hl-cvd-recorder:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-hl-cvd
    restart: unless-stopped
    # --ws: persistent trade-tape subscription (<200ms CVD latency)
    command: ["./hl-cvd-recorder", "--ws"]
    depends_on:
      scraper-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${HLSCRAPER_DB_USER:-nofx}:${HLSCRAPER_DB_PASSWORD:-nofx}@scraper-postgres:5432/${HLSCRAPER_DB_NAME:-nofx}?sslmode=disable
      COLLECTOR_COINS: ${HLSCRAPER_COINS:-BTC,ETH,SOL,BNB,XRP,DOGE,ADA,AVAX,LINK,DOT,TRX,LTC,ATOM,UNI,APT,ARB,OP,SUI,TON,CRV}
    networks:
      - nofx-network

  hl-liq-collector:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-hl-liq
    restart: unless-stopped
    command: ["./hl-liq-collector"]
    depends_on:
      scraper-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${HLSCRAPER_DB_USER:-nofx}:${HLSCRAPER_DB_PASSWORD:-nofx}@scraper-postgres:5432/${HLSCRAPER_DB_NAME:-nofx}?sslmode=disable
      COLLECTOR_COINS: ${HLSCRAPER_COINS:-BTC,ETH,SOL,BNB,XRP,DOGE,ADA,AVAX,LINK,DOT,TRX,LTC,ATOM,UNI,APT,ARB,OP,SUI,TON,CRV}
      LIQ_SNAPSHOT_INTERVAL_SEC: "60"
    networks:
      - nofx-network

  hl-retention:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-hl-retention
    restart: unless-stopped
    command: ["./hl-retention"]
    depends_on:
      scraper-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${HLSCRAPER_DB_USER:-nofx}:${HLSCRAPER_DB_PASSWORD:-nofx}@scraper-postgres:5432/${HLSCRAPER_DB_NAME:-nofx}?sslmode=disable
    networks:
      - nofx-network

  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    # Tag local builds to the fork's ghcr so `docker compose push`
    # publishes exactly what CI would (docker-build.yml derives the
    # same path from the repo name).
    image: ghcr.io/jaiiye/nofx/nofx-backend:latest
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
      # pprof profiling is bound to host loopback only; uncomment for local debug.
      # - "127.0.0.1:6060:6060"
    volumes:
      # NOTE: .env is bind-mounted so the beginner-onboarding flow
      # (persistBeginnerWalletEnv) can write CLAW402_WALLET_* back to the host
      # file. Without this mount the wallet is regenerated on every container
      # restart. For threat models where the .env file should not be reachable
      # via container RCE, deploy via env vars only and remove this mount.
      - ./.env:/app/.env
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      # Self-hosted data plane: netflow/OI/price rankings and the
      # "hl_pool" coin source read from the scraper Postgres. Remove to
      # fall back to the paid nofxos/vergex sources.
      - HLSCRAPER_DSN=postgres://${HLSCRAPER_DB_USER:-nofx}:${HLSCRAPER_DB_PASSWORD:-nofx}@scraper-postgres:5432/${HLSCRAPER_DB_NAME:-nofx}?sslmode=disable
    networks:
      - nofx-network
    depends_on:
      scraper-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    image: ghcr.io/jaiiye/nofx/nofx-frontend:latest
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge

volumes:
  scraper-pgdata:
